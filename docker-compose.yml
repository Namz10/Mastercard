services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aegisloop
      POSTGRES_PASSWORD: aegisloop
      POSTGRES_DB: aegisloop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisloop -d aegisloop"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://aegisloop:aegisloop@postgres:5432/aegisloop
      IDENTIFY_LIVE_SEARCH: "false"
      AEGIS_LLM_PROFILE: omniroute
      AEGIS_LLM_BASE_URL: http://127.0.0.1:20128/v1
      AEGIS_LLM_MODEL: auto
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
