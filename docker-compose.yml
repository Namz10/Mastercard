services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegisloop
      POSTGRES_PASSWORD: aegisloop
      POSTGRES_DB: aegisloop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisloop"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://aegisloop:aegisloop@postgres:5432/aegisloop
      IDENTIFY_LIVE_SEARCH: "false"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
