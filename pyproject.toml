[project]
name = "aegisloop"
version = "0.1.0"
description = "AegisLoop — Identify, Generate, Defend closed-loop lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "langgraph>=0.2",
    "httpx>=0.27",
    "trafilatura>=1.6",
    "feedparser>=6.0",
    "fastembed>=0.4.0",
    "pgvector>=0.3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
embeddings-st = [
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_llm: requires a running OmniRoute (or configured) LLM endpoint",
    "live_identify: requires TAVILY_API_KEY and a configured LLM (skip in CI)",
]
